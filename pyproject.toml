[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sportapi"
dynamic = ["version"]
description = "Official Python client for the SportAPI Sport Line API: Prematch and Live sports odds, scores and statistics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "SportAPI" }]
keywords = [
  "sportapi",
  "sports-api",
  "odds-api",
  "betting-api",
  "sportsbook",
  "live-scores",
  "esports",
  "sports-data",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.21",
  "respx>=0.20",
  "ruff>=0.5",
  "mypy>=1.8",
  "build>=1",
]

[project.urls]
Homepage = "https://sportapi.net"
Documentation = "https://sportapi.net/docs/sport-line/getting-started/quick-start.html"
"API reference" = "https://sportapi.net/docs/sport-line/api-reference/overview.html"
Source = "https://github.com/SportApi-net/sportapi-python"
Issues = "https://github.com/SportApi-net/sportapi-python/issues"
Changelog = "https://github.com/SportApi-net/sportapi-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/sportapi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sportapi"]

[tool.hatch.build.targets.sdist]
include = [
  "src/sportapi",
  "tests",
  "examples",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "examples"]

[tool.ruff.format]
exclude = ["*.md"]  # README samples keep aligned comments

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "UP006",  # keep typing.List etc. for Python 3.9 readers
  "UP007",  # Optional[...] instead of X | None (3.9 support)
  "UP035",
  "UP045",
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF022",  # __all__ is grouped by topic
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/sportapi"]
